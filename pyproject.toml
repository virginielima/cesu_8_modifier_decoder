[project]
name = "cesu-8-modifier-decoder"
version = "0.1.1"
description = "Decodes CESU-8 encoded byte sequences, handling surrogate pair representation of supplementary characters, into Python strings."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
